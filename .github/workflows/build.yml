name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: powershell
        run: .\test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: RegionChangeClicker-Windows
          path: dist/RegionChangeClicker.exe
